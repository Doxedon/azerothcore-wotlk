name: Build and Publish

on:
  push:
    branches: [ "Playerbot" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Worldserver
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/worldserver/Dockerfile
          push: true
          # The | downcase filter forces everything to lowercase
          tags: ghcr.io/${{ github.repository_owner | downcase }}/${{ github.event.repository.name | downcase }}-worldserver:latest

      - name: Build and push Authserver
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/authserver/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner | downcase }}/${{ github.event.repository.name | downcase }}-authserver:latest