name: Build and Publish

on:
  push:
    branches: [ "Playerbot" ]
  workflow_dispatch:

env:
  # This stops the harmless Node 20 deprecation warnings in the logs
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # --- PATCH 1: FIX C++ API DIVERGENCE BETWEEN ELUNA & PLAYERBOTS ---
      - name: Patch Eluna for Playerbot API
        run: |
          sed -i 's/InstanceScript\* instanceData/InstanceScript** instanceData/' modules/mod-eluna/src/ElunaLuaEngine_SC.cpp
          sed -i 's/instanceData = sEluna->GetInstanceData/*instanceData = sEluna->GetInstanceData/' modules/mod-eluna/src/ElunaLuaEngine_SC.cpp
          sed -i '/OnBeforeCreateInstanceScript/s/ override//' modules/mod-eluna/src/ElunaLuaEngine_SC.cpp
          sed -i '/CanExecuteCommand/s/ override//' modules/mod-eluna/src/ElunaLuaEngine_SC.cpp

      # --- PATCH 2: PREVENT OUT OF MEMORY CRASHES ---
      - name: Create Swap Space
        run: |
          sudo fallocate -l 10G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Database Importer Image
      - name: Build and push db-import
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/docker/Dockerfile
          target: db-import
          push: true
          tags: ghcr.io/doxedon/ac-wotlk-db-import:playerbot

      # 2. Worldserver Image
      - name: Build and push Worldserver
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/docker/Dockerfile
          target: worldserver
          push: true
          tags: ghcr.io/doxedon/ac-wotlk-worldserver:playerbot

      # 3. Authserver Image
      - name: Build and push Authserver
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/docker/Dockerfile
          target: authserver
          push: true
          tags: ghcr.io/doxedon/ac-wotlk-authserver:playerbot
